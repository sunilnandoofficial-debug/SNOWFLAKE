name: 'snowflake_dbt_bronze_silver_gold'
version: '1.0.0'
config-version: 2
profile: 'snowflake_dbt_bronze_silver_gold'

model-paths: ['models']
seed-paths: ['seeds']
snapshot-paths: ['snapshots']
test-paths: ['tests']
macro-paths: ['macros']
analysis-paths: ['analyses']
target-path: 'target'
clean-targets: ['target', 'dbt_packages']

seeds:
  snowflake_dbt_bronze_silver_gold:
    +database: DBT_DEMO
    +schema: SEED
    +quote_columns: false
    raw_customers:
      +column_types:
        customer_id: varchar(20)
        customer_name: varchar(100)
        country: varchar(50)
        updated_at: timestamp_ntz
    raw_products:
      +column_types:
        product_id: varchar(20)
        product_name: varchar(100)
        product_category: varchar(50)
        standard_cost: number(12,2)
    raw_sales:
      +column_types:
        sale_id: varchar(20)
        customer_id: varchar(20)
        product_id: varchar(20)
        sale_date: date
        quantity: number(12,0)
        unit_price: number(12,2)
        discount_amount: number(12,2)
        currency_code: varchar(3)
        updated_at: timestamp_ntz

models:
  snowflake_dbt_bronze_silver_gold:
    +persist_docs:
      relation: true
      columns: true
    bronze:
      +schema: BRONZE
      +materialized: view
      +tags: ['bronze']
    silver:
      +schema: SILVER
      +materialized: view
      +tags: ['silver']
    gold:
      +schema: GOLD
      +materialized: table
      +tags: ['gold']
    semantic:
      +schema: SEMANTIC
      +materialized: view
      +tags: ['semantic']
