version: 2

sources:
  - name: demo_seed
    database: DBT_DEMO
    schema: SEED
    description: "Illustrative seed tables used to demonstrate the pipeline. Replace with real landed RAW tables in production."
    tables:
      - name: raw_customers
        description: "Customer source records."
        columns:
          - name: customer_id
            tests: [not_null]
      - name: raw_products
        description: "Product and standard cost source records."
        columns:
          - name: product_id
            tests: [not_null]
      - name: raw_sales
        description: "Sales transactions."
        columns:
          - name: sale_id
            tests: [not_null]
