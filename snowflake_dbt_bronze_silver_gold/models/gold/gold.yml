version: 2

models:
  - name: dim_customer
    description: "Conformed customer dimension for reporting."
    columns:
      - name: customer_key
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null, unique]
  - name: dim_product
    description: "Conformed product dimension for reporting."
    columns:
      - name: product_key
        tests: [not_null, unique]
      - name: product_id
        tests: [not_null, unique]
  - name: fct_sales
    description: "Sales fact table. Grain is one row per sale_id; amounts remain in transaction currency."
    columns:
      - name: sales_key
        tests: [not_null, unique]
      - name: sale_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: net_sales_amount
        tests: [not_null]
  - name: agg_sales_monthly
    description: "Monthly sales KPIs by transaction currency."
    columns:
      - name: sale_month
        tests: [not_null]
      - name: currency_code
        tests: [not_null]
