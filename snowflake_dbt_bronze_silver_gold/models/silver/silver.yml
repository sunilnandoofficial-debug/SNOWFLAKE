version: 2

models:
  - name: stg_customers
    description: "Standardized and deduplicated customer records."
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: customer_name
        tests: [not_null]
  - name: stg_products
    description: "Standardized and deduplicated product records."
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: standard_cost
        tests: [not_null]
  - name: stg_sales
    description: "Typed and deduplicated transactions, one row per sale_id."
    columns:
      - name: sale_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: sale_date
        tests: [not_null]
      - name: quantity
        tests: [not_null]
  - name: int_sales_enriched
    description: "Sales enriched with customer and product attributes and derived financial measures."
    columns:
      - name: sale_id
        tests: [not_null, unique]
      - name: net_sales_amount
        tests: [not_null]
